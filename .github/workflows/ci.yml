name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:

    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://openalex:openalex_password@localhost:5432/openalex_test

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB=openalex
          POSTGRES_USER=openalex
          POSTGRES_PASSWORD=openalex_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run migrations
        env:
          POSTGRES_DB: openalex_test
          POSTGRES_USER: openalex
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

        run: |
          alembic upgrade head


      - name: Run tests
        env:
          POSTGRES_DB: openalex_test
          POSTGRES_USER: openalex
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

        run: |
          pytest


      - name: Build Docker image
        run: |
          docker build .
